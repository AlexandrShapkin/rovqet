[package]
name = "rovqet-sdk"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rovqet-core = { path = "../core" }
rovqet-protocol = { path = "../protocol" }
rovqet-transport = { path = "../transport" }
tokio = { version = "1", features = ["net", "io-util", "time", "macros", "rt-multi-thread"] }

[lib]
name = "rovqet_sdk"
path = "src/lib.rs"
