[package]
name = "rovqet-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rovqet"
path = "src/main.rs"

[dependencies]
rovqet-q0 = { path = "../q0" }
rovqet-router = { path = "../router" }
rovqet-core = { path = "../core" }
rovqet-control = { path = "../control" }
rovqet-metadata-raft = { path = "../metadata-raft" }
rovqet-protocol = { path = "../protocol" }
rovqet-transport = { path = "../transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
rovqet-durable = { path = "../durable" }
rovqet-wal = { path = "../wal" }
fs2 = "0.4.3"
sha2 = "0.10"
serde_json = "1"

[features]
fault-injection = ["rovqet-durable/fault-injection"]

[dev-dependencies]
rovqet-sdk = { path = "../sdk" }
tempfile = "3"
