[package]
name = "rovqet-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[[bin]]
name = "rovqet"
path = "src/main.rs"

[dependencies]
rovqet-q0 = { path = "../q0" }
rovqet-router = { path = "../router" }
rovqet-core = { path = "../core" }
rovqet-protocol = { path = "../protocol" }
rovqet-transport = { path = "../transport" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal"] }
