[package]
name = "rovqet-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
rovqet-sdk = { path = "../sdk" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# Official NATS client, isolated to the independent research tool.
async-nats = "=0.39.0"
futures-util = "0.3"
