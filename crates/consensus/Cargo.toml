[package]
name = "rovqet-consensus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
publish = false

[dependencies]
rovqet-core = { path = "../core" }
openraft = { version = "=0.9.26", features = ["serde", "storage-v2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time", "fs", "io-std"] }

[features]
# Controlled storage faults for the durable Q2 log.
fault-injection = []

[dev-dependencies]
tempfile = "3"
