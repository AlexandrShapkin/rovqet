[package]
name = "rovqet-durable"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
default = []
fault-injection = []

[dependencies]
rovqet-core = { path = "../core" }
rovqet-wal = { path = "../wal" }
rovqet-scheduler = { path = "../scheduler" }
tokio = { version = "1", features = ["sync"] }
sha2 = "0.10"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "time"] }
