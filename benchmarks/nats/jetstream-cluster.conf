# FUTURE TEMPLATE ONLY. Start three local processes with distinct client/route
# ports, names and store_dir paths. Local processes are not independent hosts.
listen: "127.0.0.1:4222"
server_name: "research-n1"
authorization { user: "rovqet", password: "development" }
cluster {
  name: "rovqet-research"
  listen: "127.0.0.1:6222"
  routes: ["nats://127.0.0.1:6223", "nats://127.0.0.1:6224"]
}
jetstream {
  store_dir: "/tmp/rovqet-nats-js-n1"
  max_memory_store: 67108864
  max_file_store: 1073741824
}
