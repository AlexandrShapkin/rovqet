[workspace]
resolver = "3"
members = [
    "crates/protocol",
    "crates/core",
    "crates/sdk",
    "crates/server",
    "crates/transport",
    "crates/router",
    "crates/scheduler",
    "crates/q0",
    "crates/wal",
    "crates/durable",
    "crates/testkit",
    "crates/control",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
repository = "https://github.com/AlexandrShapkin/rovqet"
