name: fast
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Compile workspace
        run: cargo check --workspace --locked
      - name: Fast workspace tests
        run: cargo test --workspace --locked
      - name: Inter-node RPC and metadata tests
        run: cargo test -p rovqet-control --locked
      - name: Verify executable identifies development profile
        run: cargo run --locked -p rovqet-server -- --version
      - name: Build independent-process smoke binaries
        run: cargo build -p rovqet-server -p rovqet-sdk --examples --bins --locked
      - name: Independent TCP publisher and subscribers
        run: python3 scripts/q0_smoke.py
      - name: Independent Q1 publishing and restart recovery
        run: python3 scripts/q1_smoke.py --check-hooks-disabled
      - name: Standalone Q1 replay through TCP and external Rust SDK
        run: python3 scripts/test_q1_replay.py
      - name: Q1 actor fault controls
        run: cargo test -p rovqet-durable --features fault-injection --locked
      - name: Build isolated Q1 fault-test broker
        run: cargo build -p rovqet-server --features fault-injection --locked
      - name: Durable consumer TCP delivery, ACK and crash windows
        run: python3 scripts/test_q1_consumer.py
      - name: Q1 oracle self-corruption fixtures
        run: python3 scripts/test_q1_oracle.py
      - name: Q1 independent durability and crash-recovery matrix
        run: python3 scripts/test_q1_durability.py
      - name: Q1 NACK, retry, quarantine and real DLQ ordering
        run: python3 scripts/test_q1_terminal.py
      - name: Cluster routing between two local brokers
        run: python3 scripts/test_cluster_routing.py
      - name: Q1 TCP crash boundaries and Q0 isolation
        run: python3 scripts/test_q1_faults.py
      - name: Independent testkit fixtures and sampler tests
        run: python3 -m unittest discover -s benchmarks -p 'test_*.py'
      - name: Build load generator
        run: cargo build -p rovqet-testkit --locked
      - name: Independent testkit socket smoke
        run: python3 benchmarks/run_q0.py --profiles A-basic --repetitions 1 --broker target/debug/rovqet --testkit target/debug/rovqet-testkit --output /tmp/rovqet-testkit-ci
      - name: Replay independent oracle evidence
        run: target/debug/rovqet-testkit replay --run /tmp/rovqet-testkit-ci/A-basic-r1/generator
      - name: Install checksum-pinned NATS Core baseline
        run: python3 benchmarks/install_nats.py
      - name: Independent NATS Core socket smoke
        run: python3 benchmarks/run_q0.py --backend nats --profiles A-basic --repetitions 1 --testkit target/debug/rovqet-testkit --output /tmp/rovqet-nats-ci
      - name: Replay NATS independent oracle evidence
        run: target/debug/rovqet-testkit replay --run /tmp/rovqet-nats-ci/A-basic-r1/generator

# Fast checks only. No PR requirement, mandatory human review, release build,
# long-running soak or full benchmark suite on ordinary main commits.
