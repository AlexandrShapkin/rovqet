name: fast
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 scripts/check_docs.py

  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Compile workspace
        run: cargo check --workspace --locked
      - name: Fast workspace tests
        run: cargo test --workspace --locked
      - name: Verify executable identifies bootstrap
        run: cargo run --locked -p rovqet-server -- --version

# Fast checks only. No PR requirement, mandatory human review, release build,
# long-running soak or full benchmark suite on ordinary main commits.
