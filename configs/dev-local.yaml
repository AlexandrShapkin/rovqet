# Reference settings for future local-only prototype.
# R0-01 binary checks readability but does not parse this file or start a listener.
profile: dev-local
node:
  id: n1
  cluster_id: local-test
  data_dir: ./target/rovqet-data/n1
listener:
  bind: 127.0.0.1:7443
  transport: tcp
  tls: false
auth:
  mode: static-dev
